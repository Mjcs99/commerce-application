name: Build + Deploy API (Container Apps)

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/Commerce.Api/**"
      - "src/Commerce.Application/**"
      - "src/Commerce.Infrastructure/**"
      - "src/Commerce.Domain/**"
      - "Dockerfile"
      - ".github/workflows/deploy-api.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR login server
        shell: bash
        run: |
          LOGIN_SERVER=$(az acr show -n "${{ secrets.ACR_NAME }}" -g "${{ secrets.RESOURCE_GROUP }}" --query loginServer -o tsv)
          echo "ACR_LOGIN_SERVER=$LOGIN_SERVER" >> $GITHUB_ENV
          echo "Resolved ACR login server: $LOGIN_SERVER"

      - name: Build + push image to ACR + deploy to Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: ${{ secrets.CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/commerce-api:${{ github.sha }}